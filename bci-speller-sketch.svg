<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="title desc"><title id="title">Illustrative BCI speller interface sketch</title><desc id="desc">A static five by six letter grid with the letter E outlined as an example gaze candidate. An output field and correction controls show a possible interface. No EEG decoding or gaze measurement is performed.</desc><style>text{font-family:Lato,Arial,sans-serif;fill:#202020;font-size:18px}.title{font-size:23px;fill:#202020}.small{font-size:15px;fill:#555555}.label{font-size:19px;fill:#202020}rect{fill:white;stroke:#202020;stroke-width:1.5}.line{fill:none;stroke:#202020;stroke-width:1.7;marker-end:url(#arrow)}</style><rect x="1" y="1" width="798" height="578" rx="3" style="fill:white;stroke:#cccccc"/><text x="30" y="39" class="title">Speller interface: an early layout sketch</text><text x="30" y="65" class="small">Static illustration · no live EEG or gaze data</text><rect x="30" y="89" width="470" height="57" rx="3"/><text x="47" y="123" class="small">Text output appears here…</text><rect x="30" y="173" width="69" height="53" rx="2"/><text x="64.5" y="206" text-anchor="middle">A</text><rect x="109" y="173" width="69" height="53" rx="2"/><text x="143.5" y="206" text-anchor="middle">B</text><rect x="188" y="173" width="69" height="53" rx="2"/><text x="222.5" y="206" text-anchor="middle">C</text><rect x="267" y="173" width="69" height="53" rx="2"/><text x="301.5" y="206" text-anchor="middle">D</text><rect x="346" y="173" width="69" height="53" rx="2" style="fill:#eeeeee;stroke:#202020;stroke-width:2.5"/><text x="380.5" y="206" text-anchor="middle">E</text><rect x="425" y="173" width="69" height="53" rx="2"/><text x="459.5" y="206" text-anchor="middle">F</text><rect x="30" y="238" width="69" height="53" rx="2"/><text x="64.5" y="271" text-anchor="middle">G</text><rect x="109" y="238" width="69" height="53" rx="2"/><text x="143.5" y="271" text-anchor="middle">H</text><rect x="188" y="238" widt