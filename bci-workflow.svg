<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" role="img" aria-labelledby="title desc"><title id="title">Conceptual EEG and eye-tracking speller workflow</title><desc id="desc">A spelling display provides event timing. EEG and gaze recordings feed a synchronisation and quality-check stage, followed by a candidate selection rule and text feedback. This is a conceptual workflow, not a confirmed implementation.</desc><style>text{font-family:Lato,Arial,sans-serif;fill:#202020;font-size:18px}.title{font-size:23px;fill:#202020}.small{font-size:15px;fill:#555555}.label{font-size:19px;fill:#202020}rect{fill:white;stroke:#202020;stroke-width:1.5}.line{fill:none;stroke:#202020;stroke-width:1.7;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#202020" stroke-width="1.5"/></marker></defs><rect x="1" y="1" width="798" height="548" rx="3" style="fill:white;stroke:#cccccc"/><text x="32" y="40" class="title">P300 + eye tracking: a possible workflow</text><text x="32" y="66" class="small">Concept sketch · integration and selection rules to be defined</text><rect x="250" y="95" width="300" height="65" rx="3"/><text x="400" y="123" text-anchor="middle" class="label">Spelling display</text><text x="400" y="147" text-anchor="middle" class="small">Character flashes and event timing</text><path d="M330 160V188H210V212" class="line"/><path d="M470 160V188H590V212" class="line"/><rect x="65" y="216" width="290" height="73" rx="3"/><text x="210" y="246" text-anchor="middle" class="label">P300 / EEG recording</text><text x="210" y="270" text-anchor="middle" class="small">Responses aligned to flash events</text><rect x="445" y="216" width="290" height="73" rx="3"/><text x="590" y="246" text-anchor="middle" class="label">Eye tracking</text><text x="590" y="270" text-anchor="middle" class="small">Gaze position and tracking quality</text><path d="M210 289V316H345V337" class="line"/><path d="M590 289V316H455V337" class="line"/><rect x="220" y="341" width="360" height="64" rx="3"/><text x="400" y="369" text-anchor="middle" class="label">Synchronise and inspect</text><text x="400" y="392" text-anchor="middle" class="small">Align events; check signal quality</text><path d="M400 405V431" class="line"/><rect x="170" y="435" width="460" height="65" rx="3"/><text x="400" y="463" text-anchor="middle" class="label">Candidate selection → text feedback</text><text x="400" y="487" text-anchor="middle" class="small">Allow uncertainty, correction and no selection</text><text x="32" y="531" class="small">A design direction to explore, not a description of a finished system.</text></svg>